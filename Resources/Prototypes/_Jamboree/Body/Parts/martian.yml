- type: entity
  id: PartMartian
  parent: [BaseItem, BasePart]
  name: "martian body part"
  abstract: true
  components:
  - type: Icon # Shitmed Change
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Martian
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: ChestMartian
  name: "martian bulb"
  parent: [PartMartian, BaseChest, BaseGroin, BaseHead]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "head"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: LeftArmMartian
  name: "left martian tentacle"
  parent: [PartMartian, BaseLeftArm]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "left_arm"

- type: entity
  id: RightArmMartian
  name: "right martian tentacle"
  parent: [PartMartian, BaseRightArm]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "right_arm"

- type: entity
  id: LeftHandMartian
  name: "left martian tentacle tip"
  parent: [PartMartian, BaseLeftHand]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "left_hand"
  - type: DoAfterDelayMultiplier # Goobstation
    multiplier: 0.9

- type: entity
  id: RightHandMartian
  name: "right martian tentacle tip"
  parent: [PartMartian, BaseRightHand]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "right_hand"
  - type: DoAfterDelayMultiplier # Goobstation
    multiplier: 0.9

- type: entity
  id: LegsMartian
  name: "martian tentacle bundle"
  parent: [PartMartian, BaseLeftLeg, BaseRightLeg, BaseLeftFoot, BaseRightFoot]
  components:
  - type: Sprite
    sprite: _Jamboree/Mobs/Species/Martian/parts.rsi
    state: "legs"
