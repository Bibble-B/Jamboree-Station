- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltOwl
  name: owl's belt
  suffix: DO NOT MAP THIS
  description: A belt for every gadget you might need in your heroic crusade. Also has instructions on Judo in a small pocket near the back.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/SuperSuit/Belt/bird_belt.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/SuperSuit/Belt/bird_belt.rsi
  - type: GrantCorporateJudo
  - type: GuideHelp
    guides:
    - CorporateJudo
  - type: StorageFill
    contents:
      - id: WeaponGrapplingGun
        amount: 1
      - id: SmokeGrenade
        amount: 2
      - id: OwlThrowingStar
        amount: 2
      - id: Zipties
        amount: 4

- type: entity
  parent: [ ClothingBeltStorageBase, BaseSyndicateContraband]
  id: ClothingBeltGriffin
  name: griffin's belt
  suffix: DO NOT MAP THIS
  description: A belt for every gadget you might need in your villainous crusade. Also has instructions on Judo in a small pocket near the back.
  components:
  - type: Sprite
    sprite: _Jamboree/Clothing/SuperSuit/Belt/bird_belt.rsi
  - type: Clothing
    sprite: _Jamboree/Clothing/SuperSuit/Belt/bird_belt.rsi
  - type: GrantCorporateJudo
  - type: GuideHelp
    guides:
    - CorporateJudo
  - type: StorageFill
    contents:
      - id: WeaponGrapplingGun
        amount: 1
      - id: SmokeGrenade
        amount: 2
      - id: GriffinThrowingKnife
        amount: 2
      - id: Zipties
        amount: 4

# Jamboree, Bringin in the macho man

- type: entity
  parent: [ ClothingBeltChampion, BaseMagicalContraband ]
  id: ClothingBeltWrestler
  name: wrestling belt
  description: It's time to step into the ring.
  components:
  - type: ClothingGrantComponent
    component:
    - type: ActionGrant
      actions:
        - ActionWrestlerKick
        - ActionWrestlerStrike
#        - ActionWrestlerDrop
#        - ActionWrestlerThrow
        - ActionWrestlerSlam
    - type: Wrestler
    - type: WrestlerKick
    - type: WrestlerStrike
#    - type: WrestlerDrop
#    - type: WrestlerThrow
    - type: WrestlerSlam
  - type: ClothingSpeedModifier
    walkModifier: 1.2
    sprintModifier: 1.2
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.5
