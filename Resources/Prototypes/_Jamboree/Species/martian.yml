- type: species
  id: Martian
  name: species-name-thaven
  roundStart: true
  prototype: MobMartian
  sprites: MobMartianSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobMartianMarkingLimits
  dollPrototype: MobMartianDummy
  skinColoration: Hues
  maleFirstNames: NamesThaven
  femaleFirstNames: NamesThaven
  naming: First
  minAge: 18
  youngAge: 50
  oldAge: 260
  maxAge: 360 # pre-contact thavens?? idk
  averageHeight: 188 # Thaven sprites are roughly 4" taller than standard humanoid sprites, this makes their height values display accurately
  sizeRatio: 1.15 # Thaven height/weight ratios are a bit more constrained than other species so they don't get too misshapen
  minHeight: 0.85 # 5'3" (160cm)
  #defaultHeight: 1
  maxHeight: 1.217 # 7'6" (229cm)
  minWidth: 0.75 # 11" (30cm)
  #defaultWidth: 1
  maxWidth: 1.3 # 20" (52cm)

- type: speciesBaseSprites
  id: MobMartianSprites
  sprites:
    Eyes: MobMartianEyes
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking
    Undershirt: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Chest: MobMartianBody
    LArm: MobMartianLArm
    RArm: MobMartianRArm
    LHand: MobMartianLHand
    RHand: MobMartianRHand
    LLeg: MobMartianLegs

- type: markingPoints
  id: MobMartianMarkingLimits
  onlyWhitelisted: true
  points:
    Snout:
      points: 1
      required: true
      defaultMarkings: [ MartianEyeshine ]
    Tail:
      points: 2 # DEN - 2 points
      required: false
    HeadTop:
      points: 8
      required: false
    HeadSide:
      points: 6 # more earrings
      required: false
    Chest:
      points: 6
      required: false
    Undershirt:
      points: 2
      required: false
    Underwear:
      points: 2
      required: false
    Legs:
      points: 2
      required: false
    RightArm:
      points: 6
      required: false
    RightHand:
      points: 6
      required: false
    LeftArm:
      points: 6
      required: false
    LeftHand:
      points: 6
      required: false

